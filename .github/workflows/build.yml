name: Build Luna VPN APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d

      - name: Compile hev-socks5-tunnel
        run: |
          git clone --recursive https://github.com/heiher/hev-socks5-tunnel.git
          cd hev-socks5-tunnel
          mkdir -p ../app/src/main/jniLibs
          ${ANDROID_NDK_HOME}/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./Android.mk NDK_APPLICATION_MK=./Application.mk APP_ABI="arm64-v8a armeabi-v7a x86 x86_64"
          cp -r libs/* ../app/src/main/jniLibs/

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: luna-vpn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
